# Round-5 configuration (E14): as config_5mhz_used.yaml, signoff liberty sky130_fd_sc_hd__ss_n40C_1v28 (generated by synthesis/harden_lowv.sh)
# Round-5 configuration (E1): common 5 MHz clock, utilization policy; generated from config.yaml by synthesis/harden_policy2.sh
# OpenLane 2 config for bmi_snn_min32: energy-minimised hardwired core (16-bit state, no dense mode).
DESIGN_NAME: bmi_snn_min32
VERILOG_FILES:
  - dir::../../rtl/gen/bmi_snn_min32.v
VERILOG_INCLUDE_DIRS:
  - dir::../../rtl/h32
CLOCK_PORT: clk
CLOCK_PERIOD: 200
PNR_SDC_FILE: dir::bmi_snn_min32.sdc
SIGNOFF_SDC_FILE: dir::bmi_snn_min32.sdc
STD_CELL_LIBRARY: sky130_fd_sc_hd
FP_SIZING: relative
FP_CORE_UTIL: 50
PL_TARGET_DENSITY_PCT: 60
GRT_ALLOW_CONGESTION: true
ERROR_ON_SYNTH_CHECKS: false
RUN_LINTER: false
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_WRITE_LEF: false
RUN_MAGIC_DRC: false
RUN_KLAYOUT_XOR: false
RUN_LVS: false
RUN_IRDROP_REPORT: false
RUN_ANTENNA_REPAIR: false
RUN_HEURISTIC_DIODE_INSERTION: false   # round 5: heuristic diodes broke legalization at 50-60 % utilization; diodes on input ports only
DIODE_ON_PORTS: in
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.1

# E14: low-voltage signoff corner (ss, -40 C, 1.28 V) as the default corner; the PDK corners are kept
LIB:
  "*_tt_025C_1v80": ["/media/pdk/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__tt_025C_1v80.lib"]
  "*_ss_100C_1v60": ["/media/pdk/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__ss_100C_1v60.lib"]
  "*_ff_n40C_1v95": ["/media/pdk/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__ff_n40C_1v95.lib"]
  "*_ss_n40C_1v28": ["/media/pdk/sky130A/libs.ref/sky130_fd_sc_hd/lib/sky130_fd_sc_hd__ss_n40C_1v28.lib"]
STA_CORNERS: [nom_ss_n40C_1v28, min_ss_n40C_1v28, max_ss_n40C_1v28, nom_tt_025C_1v80, nom_ss_100C_1v60, nom_ff_n40C_1v95, min_tt_025C_1v80, min_ss_100C_1v60, min_ff_n40C_1v95, max_tt_025C_1v80, max_ss_100C_1v60, max_ff_n40C_1v95]
DEFAULT_CORNER: nom_ss_n40C_1v28
TIMING_VIOLATION_CORNERS: ["*"]
# OpenROAD's timing-driven global placement crashes (silent exit in the resizer reweighting step) with the 1.28 V liberty as the
# default corner (bmi_snn_sp, 2026-09-19); wire-length-driven placement instead
PL_TIME_DRIVEN: false
