# OpenLane 2 config for the minimal digital front end bmi_fe (round 5, E10): 32.768 kHz always-on domain + gated 5 MHz domain.
DESIGN_NAME: bmi_fe
VERILOG_FILES:
  - dir::../../rtl/bmi_fe.v
CLOCK_PORT: clk5
CLOCK_PERIOD: 200
PNR_SDC_FILE: dir::bmi_fe.sdc
SIGNOFF_SDC_FILE: dir::bmi_fe.sdc
STD_CELL_LIBRARY: sky130_fd_sc_hd
FP_SIZING: relative
FP_CORE_UTIL: 60
PL_TARGET_DENSITY_PCT: 70
GRT_ALLOW_CONGESTION: true
ERROR_ON_SYNTH_CHECKS: false
RUN_LINTER: false
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_WRITE_LEF: false
RUN_MAGIC_DRC: false
RUN_KLAYOUT_XOR: false
RUN_LVS: false
RUN_IRDROP_REPORT: false
RUN_ANTENNA_REPAIR: false
RUN_HEURISTIC_DIODE_INSERTION: true
PL_RESIZER_HOLD_SLACK_MARGIN: 0.3
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3
