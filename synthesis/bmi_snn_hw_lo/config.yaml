# OpenLane 2 config for bmi_snn_hw: parallel core with hardwired weights, no macro.
DESIGN_NAME: bmi_snn_hw
VERILOG_FILES:
  - dir::../../rtl/gen/bmi_snn_hw.v
VERILOG_INCLUDE_DIRS:
  - dir::../../rtl
CLOCK_PORT: clk
CLOCK_PERIOD: 20
PNR_SDC_FILE: dir::../bmi_snn_hw/bmi_snn_hw.sdc
SIGNOFF_SDC_FILE: dir::../bmi_snn_hw/bmi_snn_hw.sdc
STD_CELL_LIBRARY: sky130_fd_sc_hd
FP_SIZING: relative
FP_CORE_UTIL: 28
PL_TARGET_DENSITY_PCT: 38
GRT_ALLOW_CONGESTION: true
ERROR_ON_SYNTH_CHECKS: false
RUN_LINTER: false
PRIMARY_GDSII_STREAMOUT_TOOL: klayout
RUN_MAGIC_STREAMOUT: false
RUN_MAGIC_WRITE_LEF: false
RUN_MAGIC_DRC: false
RUN_KLAYOUT_XOR: false
RUN_LVS: false
RUN_IRDROP_REPORT: false
RUN_ANTENNA_REPAIR: false
RUN_HEURISTIC_DIODE_INSERTION: true
PL_RESIZER_HOLD_SLACK_MARGIN: 0.3
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.3
DRT_OPT_ITERS: 24
SYNTH_STRATEGY: "DELAY 0"
PL_RESIZER_SETUP_SLACK_MARGIN: 0.5
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.3
